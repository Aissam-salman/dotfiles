# Improve colors
set -g default-terminal 'screen-256color'
set -ga terminal-overrides ",xterm-256color:Tc"

set -sg escape-time 0
# Set scrollback buffer to 10000
set -g history-limit 50000

# Enable mouse mode
set -g mouse on

# vi key mov for copy/paste mode 
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind r source-file ~/.tmux.conf  \; display-message "tmux.conf reloaded"
bind c new-window -c "#{pane_current_path}"

# ============================================================================
# KEYBINDINGS - TMUX SESSIONIZER & FZF
# ============================================================================

# TMUX SESSIONIZER - La commande principale (Ctrl-a f)
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# FZF SESSION SWITCHER
bind-key s run-shell "tmux neww ~/.local/bin/tmux-session-switcher"

# KILL SESSION avec FZF
bind-key X run-shell "~/.local/bin/tmux-kill-session"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'rose-pine/tmux'

run '~/.tmux/plugins/tpm/tpm'
