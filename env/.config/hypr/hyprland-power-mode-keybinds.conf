# Configuration suggérée pour Hyprland
# Ajoutez ces lignes à ~/.config/hypr/hyprland.conf

# ====================================
# Power Mode Management
# ====================================

# Menu wofi pour changer de mode d'alimentation
bind = SUPER, P, exec, power-mode-menu

# Ou utilisez SUPER + SHIFT + P si SUPER + P est déjà utilisé
# bind = SUPER SHIFT, P, exec, power-mode-menu

# Raccourcis directs (optionnel)
# bind = SUPER CTRL, 1, exec, ~/.local/scripts/power-mode performance
# bind = SUPER CTRL, 2, exec, ~/.local/scripts/power-mode balanced
# bind = SUPER CTRL, 3, exec, ~/.local/scripts/power-mode power-saver
